<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniela Zúñiga Jiménez — Portafolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400&family=Inter:wght@400;500;600&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#2B3714; --deep-2:#41541F;
  --ivory:#F4F1E7; --ivory-2:#FAF8F1;
  --ink:#26251C; --ink-soft:#5C5A48;
  --gold:#9C7B35; --gold-soft:#CEBF99;
  --rule:#DCD6C4;
  --shadow:0 1px 2px rgba(38,37,28,.05), 0 14px 34px -18px rgba(38,37,28,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--ivory);color:var(--ink);
  font-family:"Spectral",Georgia,serif;font-weight:400;font-size:16.5px;line-height:1.68;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1060px;margin:0 auto;padding:0 26px}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:400;letter-spacing:-.015em}
.ui{font-family:"Inter","Helvetica Neue",Arial,sans-serif}
a{color:inherit}
img{max-width:100%}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:40;background:rgba(244,241,231,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 26px;flex-wrap:wrap}
.brand{font-family:"Fraunces",serif;font-size:16px}
.brand em{font-style:italic;color:var(--gold)}
.menu{display:flex;gap:4px;flex-wrap:wrap}
.menu a{font-family:"Inter",sans-serif;font-size:13.5px;font-weight:500;text-decoration:none;color:var(--ink-soft);padding:8px 13px;border-radius:999px;transition:.16s}
.menu a:hover{color:var(--deep);background:rgba(43,55,20,.07)}
.langs{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--ivory-2)}
.langs button{font-family:"Inter",sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;background:transparent;border:0;padding:7px 13px;cursor:pointer;color:var(--ink-soft);transition:.16s}
.langs button[aria-pressed="true"]{background:var(--deep);color:var(--ivory)}
.langs button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}

/* ---------- hero ---------- */
.hero{position:relative;background:var(--deep);color:var(--ivory);overflow:hidden}
.hero-bg{position:absolute;inset:0;opacity:.45;pointer-events:none}
.hero-bg svg{width:130%;height:130%;position:absolute;top:-14%;right:-28%}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:60px;align-items:center;padding-top:84px;padding-bottom:84px}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:"Inter",sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-soft);border:1px solid rgba(206,191,153,.45);border-radius:999px;padding:7px 16px;margin-bottom:26px}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold-soft)}
.hero h1{font-size:clamp(2.4rem,5.2vw,3.7rem);line-height:1.06;margin:0 0 10px;font-weight:300;color:#fff}
.hero h1 em{font-style:italic;color:var(--gold-soft)}
.role{font-family:"Inter",sans-serif;font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);margin:0 0 22px}
.hero p.lede{font-size:1.08rem;line-height:1.65;max-width:52ch;margin:0 0 30px;color:rgba(244,241,231,.88)}
.hero p.lede strong{color:#fff;font-weight:500}
.loc{font-family:"Inter",sans-serif;font-size:13px;color:rgba(244,241,231,.75);margin:0 0 30px;display:flex;gap:18px;flex-wrap:wrap}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{font-family:"Inter",sans-serif;font-size:14px;font-weight:600;text-decoration:none;border-radius:999px;padding:13px 28px;transition:.16s;display:inline-block}
.btn-solid{background:var(--gold-soft);color:var(--deep);border:1px solid var(--gold-soft)}
.btn-solid:hover{background:#fff;border-color:#fff}
.btn-line{background:transparent;color:var(--ivory);border:1px solid rgba(206,191,153,.5)}
.btn-line:hover{border-color:var(--gold-soft);color:var(--gold-soft)}
.portrait{margin:0;justify-self:end;width:100%;max-width:330px}
.portrait img{display:block;width:100%;aspect-ratio:3/3.6;object-fit:cover;object-position:center 30%;border-radius:170px 170px 8px 8px;border:1px solid rgba(206,191,153,.55);box-shadow:0 24px 50px -24px rgba(0,0,0,.5)}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:40px}.portrait{justify-self:start;max-width:240px}}

/* ---------- section scaffolding ---------- */
section{padding:84px 0}
.kicker{font-family:"Inter",sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.19em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
.sec-title{font-size:clamp(1.8rem,3.6vw,2.5rem);line-height:1.15;margin:0 0 16px;font-weight:300}
.sec-intro{max-width:62ch;color:var(--ink-soft);margin:0 0 44px}

/* ---------- about ---------- */
.about{border-bottom:1px solid var(--rule)}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;margin-bottom:46px}
.about-body p{margin:0 0 15px;max-width:58ch}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:var(--ivory-2);border:1px solid var(--rule);border-radius:6px;padding:26px 26px 24px;box-shadow:var(--shadow)}
.card h3{font-size:1.12rem;margin:0 0 10px;color:var(--deep-2)}
.card p{margin:0;font-size:.95rem;color:var(--ink-soft)}
@media (max-width:860px){.about-grid{grid-template-columns:1fr;gap:20px}}

/* ---------- projects ---------- */
.projects{background:var(--ivory-2);border-bottom:1px solid var(--rule)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px}
.pcard{background:#fff;border:1px solid var(--rule);border-radius:8px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .18s, border-color .18s}
.pcard:hover{transform:translateY(-4px);border-color:var(--gold-soft)}
.pcard .thumb{aspect-ratio:16/9;background:var(--ivory);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}
.pcard .thumb img{width:100%;height:100%;object-fit:contain}
.pcard .body{padding:24px 24px 22px;display:flex;flex-direction:column;gap:12px;flex:1}
.pcard .year{font-family:"Inter",sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.pcard h3{font-size:1.22rem;line-height:1.25;margin:0}
.pcard p{margin:0;font-size:.95rem;color:var(--ink-soft);flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:"Inter",sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);background:rgba(156,123,53,.08);border:1px solid rgba(156,123,53,.25);padding:3px 10px;border-radius:999px}
.plinks{display:flex;gap:14px;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--rule);margin-top:2px}
.plinks a{font-family:"Inter",sans-serif;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--deep-2);padding-top:10px}
.plinks a:hover{color:var(--gold)}

/* ---------- contact ---------- */
.contact{text-align:center}
.contact .sec-intro{margin-left:auto;margin-right:auto}
.contact-rows{display:flex;justify-content:center;gap:14px 40px;flex-wrap:wrap;margin:0 0 38px;font-family:"Inter",sans-serif;font-size:14.5px}
.contact-rows a{text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:2px}
.contact-rows a:hover{color:var(--gold)}
.contact-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.btn-deep{background:var(--deep);color:var(--ivory);border:1px solid var(--deep)}
.btn-deep:hover{background:var(--deep-2);border-color:var(--deep-2)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}

footer{background:var(--deep);color:rgba(244,241,231,.75);padding:34px 0}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;font-family:"Inter",sans-serif;font-size:12.5px}
footer a{color:var(--gold-soft);text-decoration:none}

/* ---------- movimiento ---------- */
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes drift{from{transform:rotate(0deg) scale(1)}to{transform:rotate(4deg) scale(1.05)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
@keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}

.hero .badge{animation:rise .7s .05s cubic-bezier(.2,.7,.2,1) both}
.hero h1{animation:rise .7s .15s cubic-bezier(.2,.7,.2,1) both}
.hero .role{animation:rise .7s .25s cubic-bezier(.2,.7,.2,1) both}
.hero p.lede{animation:rise .7s .35s cubic-bezier(.2,.7,.2,1) both}
.hero .loc{animation:rise .7s .45s cubic-bezier(.2,.7,.2,1) both}
.hero-actions{animation:rise .7s .55s cubic-bezier(.2,.7,.2,1) both}
.portrait{animation:rise .9s .3s cubic-bezier(.2,.7,.2,1) both}
.hero-bg svg{animation:drift 26s ease-in-out infinite alternate;transform-origin:60% 40%}
.badge::before{animation:pulse 2s ease-in-out infinite}

.caret{display:inline-block;width:2px;height:1em;background:var(--gold-soft);vertical-align:-.15em;margin-left:3px;animation:blink 1s steps(1) infinite}

.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.pcard.reveal{transition-delay:var(--d,0s)}

.pcard .thumb img{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.pcard:hover .thumb img{transform:scale(1.05)}
.pcard:hover{box-shadow:0 4px 8px rgba(38,37,28,.06), 0 24px 48px -18px rgba(38,37,28,.34)}
.card{transition:transform .2s, border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--gold-soft)}
.btn{position:relative}
.btn:active{transform:scale(.97)}
.menu a.active{color:var(--deep);background:rgba(43,55,20,.09)}
.plinks a{transition:.16s;display:inline-block}
.plinks a:hover{transform:translateX(3px)}
.portrait img{transition:transform .5s ease}
.portrait:hover img{transform:scale(1.02)}

.totop{position:fixed;right:22px;bottom:22px;z-index:50;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--rule);background:var(--ivory-2);color:var(--deep);font-size:18px;cursor:pointer;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;font-family:"Inter",sans-serif}
.totop.show{opacity:1;pointer-events:auto}
.totop:hover{background:var(--deep);color:var(--ivory);border-color:var(--deep)}

@media (prefers-reduced-motion:reduce){
  .hero .badge,.hero h1,.hero .role,.hero p.lede,.hero .loc,.hero-actions,.portrait{animation:none}
  .hero-bg svg,.badge::before,.caret{animation:none}
  .reveal{opacity:1;transform:none;transition:none}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
</style>
</head>

/* --- efecto de escritura en el rol --- */
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let typeTimer = null;
function startTyping(){
  clearTimeout(typeTimer);
  const elT = document.getElementById("typed");
  const words = UI[lang].roles;
  if (reduced){ elT.textContent = words.join(" · "); return; }
  let wi = 0, ci = 0, del = false;
  (function tick(){
    const w = words[wi];
    elT.textContent = w.slice(0, ci);
    if (!del && ci < w.length){ ci++; typeTimer = setTimeout(tick, 55); }
    else if (!del){ del = true; typeTimer = setTimeout(tick, 1700); }
    else if (ci > 0){ ci--; typeTimer = setTimeout(tick, 28); }
    else { del = false; wi = (wi+1) % words.length; typeTimer = setTimeout(tick, 350); }
  })();
}
startTyping();

/* --- aparición al hacer scroll --- */
function markReveals(){
  document.querySelectorAll(".sec-title,.sec-intro,.kicker,.about-body,.card,.contact-rows,.contact-actions").forEach(n => n.classList.add("reveal"));
  document.querySelectorAll(".pcard").forEach((n,i) => { n.classList.add("reveal"); n.style.setProperty("--d",(i%3)*0.12+"s"); });
}
const io = new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
},{ threshold:.12 });
function observeReveals(){ document.querySelectorAll(".reveal:not(.in)").forEach(n => io.observe(n)); }
markReveals(); observeReveals();

/* --- resaltado del menú según sección --- */
const secs = ["home","about","projects","contact"];
const spy = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting){
      document.querySelectorAll(".menu a").forEach(a =>
        a.classList.toggle("active", a.getAttribute("href") === "#"+e.target.id));
    }
  });
},{ rootMargin:"-40% 0px -55% 0px" });
secs.forEach(id => { const n = document.getElementById(id); if (n) spy.observe(n); });

/* --- botón volver arriba --- */
const totop = document.getElementById("totop");
window.addEventListener("scroll", () => totop.classList.toggle("show", window.scrollY > 600), {passive:true});
totop.addEventListener("click", () => window.scrollTo({top:0, behavior: reduced ? "auto" : "smooth"}));

/* --- reconstruir efectos al cambiar idioma --- */
document.querySelectorAll(".langs button").forEach(b => {
